name: Funding Radar daily source checks and Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: funding-radar-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free PDF parser
        run: python -m pip install -r scripts/requirements.txt
      - name: Test extraction and verification rules
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Extract official NCAF announcements and application rounds
        run: python scripts/collect_ncaf.py
      - name: Validate public data
        run: python scripts/validate_data.py
      - name: Check source availability (not call verification)
        run: python scripts/check_sources.py
      - name: Commit source check results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/scan_status.json data/opportunities.json data/extraction_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official NCAF opportunities and source checks'
            git pull --rebase origin main
            git push
          fi
      - name: Package public files only
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
